aid: perfumeo
name: Perfumeo
description: >-
  Perfumeo (Perfumeo(R)) is a consumer-hardware startup that built an AI-driven smart-home
  fragrance diffuser — a connected device holding scent capsules that its companion mobile
  app uses to adapt diffusion to the user's mood. The company describes itself as combining
  AI, data science, "green mechatronics" and green chemistry, and states it was founded in
  Paris in July 2021 and relocated to Cupertino, California in April 2023. It is an
  end-user product company: no public API, SDK, developer portal, webhook surface or
  machine-readable contract has ever been published, and none was found in this pass. As of
  2026-08-26 the domain the company itself lists as its website, www.perfumeo-ai.com, no
  longer belongs to it — WHOIS shows the domain was created 2026-06-12 under a Dynadot
  privacy proxy on domain-parking nameservers, and it now serves a bot-challenge
  interstitial followed by a "Coming Soon" holding page. The company's LinkedIn page
  remains up and lists a headcount of one.
