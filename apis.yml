x-notes:
  website: >-
    NO Website pointer is emitted, deliberately. The company's own published website
    (www.perfumeo-ai.com, per its LinkedIn profile and its own press releases) is no longer
    under its control: the domain was re-registered 2026-06-12 through Dynadot behind a
    privacy proxy on *.ns.giantpanda.com parking nameservers and now serves a placeholder.
    Pointing this profile at it would send readers and agents to a parked third-party
    domain and would assert a live company website that does not exist. The previous stub
    carried "type: Website / https://www.nasdaqprivatemarket.com/", which was the HARVEST
    SOURCE (Nasdaq Private Market's own site), never Perfumeo's — that pointer has been
    removed as flatly incorrect.
  domain_security: >-
    security/perfumeo-domain-security.yml was written by probe-domain-security.py on
    2026-08-26 and then DELETED in the same pass. Because the only Website pointer in the
    stub was nasdaqprivatemarket.com, the script measured Nasdaq Private Market's TLS,
    HSTS, SPF and DMARC posture and filed it as Perfumeo's. It has been removed rather than
    re-pointed: perfumeo-ai.com is now a parking service's infrastructure, so probing it
    would credit a squatter's DNS and TLS configuration to this company. Perfumeo has no
    domain of its own left to measure.
  namesake: >-
    perfumeo.fr is a DIFFERENT and unrelated company — FUZE TRADING SAS of Reims, France, a
    Shopify perfume retailer whose homepage announces it is closing. It is not this
    company's European storefront and must not be merged into this profile or used as a
    source for it.
  unverified_claims: >-
    Funding aggregators report a $105M round at a $450M valuation (Oct 2025) and patents in
    157 countries. These are NOT asserted here: they trace to self-serve press-release wire
    copy and aggregator summaries, they were not corroborated by any primary source, and
    they sit poorly beside a LinkedIn headcount of one and a lapsed corporate domain.
